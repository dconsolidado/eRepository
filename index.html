<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .toolbar {
            width: 200px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }

        .toolbar h3 {
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            color: #bdc3c7;
        }

        .element-group {
            margin-bottom: 20px;
        }

        .element-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .element-btn:hover {
            background: #3498db;
        }

        .tool-btn {
            background: #1abc9c;
        }
        .tool-btn:hover {
            background: #16a085;
        }
        .tool-btn.active {
            background: #16a085;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }


        .canvas-container {
            flex: 1;
            position: relative;
            background: white;
            overflow: hidden;
        }

        .canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background:
                radial-gradient(circle, #ddd 1px, transparent 1px);
            background-size: 20px 20px;
            cursor: default;
        }
        .canvas.connecting-mode { /* For dynamic SVG connectors */
            cursor: crosshair;
        }
        .canvas.connecting-mode .wireframe-element:hover {
             cursor: pointer;
             border-color: #1abc9c !important;
        }
        .canvas.linking-arrow-handle { /* For dragging static arrow handles */
            cursor: grabbing;
        }


        .wireframe-element {
            position: absolute;
            border: 2px solid #3498db;
            background: rgba(52, 152, 219, 0.1); /* Default for rectangle, etc. */
            cursor: move;
            user-select: none;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #2c3e50; /* Default text color */
            font-weight: bold;
            overflow: hidden;
        }

        .wireframe-element:hover {
            border-color: #e74c3c;
            /* background: rgba(231, 76, 60, 0.1); */ /* Let fill color take precedence */
        }

        .wireframe-element.selected {
            border-color: #e74c3c !important;
            /* background: rgba(231, 76, 60, 0.2); */ /* Let fill color take precedence */
            z-index: 10;
        }
        .wireframe-element.connection-start { /* For dynamic SVG connectors */
            box-shadow: 0 0 10px #1abc9c;
            border-color: #1abc9c !important;
        }


        .button-element {
            border-radius: 6px;
            background-color: #ecf0f1; /* Default button fill */
            border: 2px solid #95a5a6;
            text-align: center;
            line-height: 1;
        }

        .text-element {
            border: 2px dashed #95a5a6;
            background: transparent;
            text-align: left;
            padding: 5px;
            line-height: 1.2;
            align-items: flex-start;
        }

        .paragraph-element {
            border: 2px dashed #7f8c8d;
            background: transparent;
            text-align: left;
            padding: 5px;
            line-height: 1.2;
            align-items: flex-start;
            white-space: pre-wrap;
        }


        .input-element {
            border: 2px solid #bdc3c7;
            background: white;
            border-radius: 2px;
            padding: 0;
            text-align: left;
            overflow: hidden;
            display: flex;
        }

        .input-field {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 5px;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
            resize: none;
        }

        .image-element {
            border: 2px solid #95a5a6;
            background: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #7f8c8d;
            text-align: center;
        }
        .image-element .caption {
            font-size: 0.7em;
            font-weight: normal;
            margin-top: 5px;
            color: #2c3e50;
        }


        .arrow-element {
            border: none;
            background: transparent;
            transform-origin: 0 50%;
        }
        .arrow-element .arrow-svg-static {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
        .arrow-element .arrow-svg-static line {
             stroke-width: 2;
             stroke: #2c3e50;
        }
        .arrow-element .arrow-svg-static polygon {
            fill: #2c3e50;
        }

        .connector-arrow-svg {
            position: absolute;
            overflow: visible;
            pointer-events: none;
            z-index: 5;
        }
        .connector-arrow-svg line {
            stroke: #2c3e50;
            stroke-width: 2;
        }
         .connector-arrow-svg polygon {
            fill: #2c3e50;
        }

        #linking-preview-line {
            stroke: #007bff;
            stroke-width: 1.5;
            stroke-dasharray: 4, 4;
        }


        .connection-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: green;
            border: 1px solid darkgreen;
            border-radius: 50%;
            cursor: grab;
            z-index: 20;
            display: none;
        }
        .wireframe-element.selected.arrow-element .connection-handle {
            display: block;
        }
        .arrow-element .connection-handle.start {
            left: -5px;
            top: 50%;
            transform: translateY(-50%);
        }
        .arrow-element .connection-handle.end {
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
        }


        .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            display: none;
            z-index: 15;
        }

        .wireframe-element.selected .delete-btn {
            display: block;
        }

        .resize-handle {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 10px;
            height: 10px;
            background: #3498db;
            cursor: se-resize;
            display: none;
            z-index: 15;
        }

        .wireframe-element.selected:not(.arrow-element) .resize-handle {
            display: block;
        }


        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
         .controls .file-input-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .controls input[type="file"] {
            display: none;
        }
        .controls .file-label-btn {
            padding: 8px 12px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .controls .file-label-btn:hover {
            background: #d35400;
        }


        .control-btn {
            padding: 8px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
         .control-btn:disabled { /* Style for disabled undo/redo */
            background: #a5b1c2;
            cursor: not-allowed;
        }

        .control-btn:hover:not(:disabled) {
            background: #2980b9;
        }

        .properties-sidebar {
            width: 220px;
            background: #ecf0f1;
            padding: 15px;
            border-left: 1px solid #bdc3c7;
            overflow-y: auto;
            color: #2c3e50;
        }
        .properties-sidebar h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            color: #7f8c8d;
            border-bottom: 1px solid #bdc3c7;
            padding-bottom: 10px;
        }
        .prop-group {
            margin-bottom:15px;
        }
        .prop-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .prop-group input[type="number"],
        .prop-group input[type="text"],
        .prop-group input[type="color"],
        .prop-group select,
        .prop-group button {
            width: 100%;
            padding: 6px;
            border-radius: 3px;
            border: 1px solid #bdc3c7;
            font-size: 12px;
            margin-bottom: 5px;
        }
         .prop-group input[type="color"] {
            height: 30px;
            padding: 3px;
        }
        .prop-group button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }
         .prop-group button:hover {
            background-color: #2980b9;
        }
        .alignment-buttons button {
            width: auto;
            padding: 5px 8px;
            margin-right: 5px;
        }
        .page-action-button {
             font-size: 0.8em !important;
             padding: 2px 5px !important;
             margin-left: 5px !important;
             background-color: #7f8c8d !important;
        }
        .page-action-button:hover {
            background-color: #95a5a6 !important;
        }
        .page-delete-button {
            background-color: #c0392b !important;
        }
        .page-delete-button:hover {
            background-color: #e74c3c !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <h3>Páginas</h3>
            <ul id="pages-list" style="list-style-type: none; padding: 0; margin-bottom:10px; max-height: 100px; overflow-y:auto;">
            </ul>
            <button id="add-page-button" class="element-btn" style="background-color: #27ae60; margin-bottom:20px;">+ Nueva Página</button>

            <h3>Elementos UI</h3>
            <div class="element-group">
                <button class="element-btn" data-type="button">📱 Botón</button>
                <button class="element-btn" data-type="input">📝 Campo de texto</button>
                <button class="element-btn" data-type="text">📄 Texto</button>
                <button class="element-btn" data-type="image">🖼️ Imagen</button>
            </div>

            <h3>Formas</h3>
            <div class="element-group">
                <button class="element-btn" data-type="rectangle">⬜ Rectángulo</button>
                <button class="element-btn" data-type="circle">⭕ Círculo</button>
                <button class="element-btn" data-type="arrow">➡️ Flecha (Estática)</button>
            </div>

            <h3>Navegación</h3>
            <div class="element-group">
                <button class="element-btn" data-type="menu">☰ Menú</button>
                <button class="element-btn" data-type="tab">📋 Pestañas</button>
                <button class="element-btn" data-type="breadcrumb">🔗 Breadcrumb</button>
            </div>

            <h3>Herramientas</h3>
            <div class="element-group">
                <button class="element-btn tool-btn" id="connect-tool">🔗 Conectar Elementos</button>
            </div>
        </div>

        <div class="canvas-container">
            <div class="controls">
                <button id="undo-button" class="control-btn" disabled>↶ Deshacer</button>
                <button id="redo-button" class="control-btn" disabled>↷ Rehacer</button>
                <button class="control-btn" onclick="clearCanvas()">🗑️ Limpiar</button>
                <button class="control-btn" onclick="exportWireframe()">💾 Exportar</button>
                <div class="file-input-group">
                    <label for="import-file-input" class="control-btn file-label-btn">📥 Importar</label>
                    <input type="file" id="import-file-input" accept=".json">
                </div>
            </div>
            <div class="canvas" id="canvas">
                 <svg id="linking-preview-svg" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 99;">
                    <line id="linking-preview-line" stroke="#007bff" stroke-width="1.5" stroke-dasharray="4,4" style="display:none;" />
                </svg>
            </div>
        </div>

        <div class="properties-sidebar" id="properties-panel">
            <h3>Propiedades</h3>
            <div id="props-content-area">
                <p>Selecciona un elemento.</p>
            </div>
        </div>
    </div>

    <script>
        let selectedElement = null;
        let isDragging = false;
        let isResizing = false;
        let dragOffset = { x: 0, y: 0 };
        let elementCounter = 0;

        let isConnectingMode = false;
        let startConnectionElementInfo = null;
        const connections = [];

        let isLinkingStaticArrowHandle = null;
        const linkingPreviewLine = document.getElementById('linking-preview-line');

        const historyStack = [];
        const redoStack = [];
        const MAX_HISTORY_STATES = 30;


        const elementConfigs = { /* ... */ };
        const propsContentArea = document.getElementById('props-content-area');
        const canvasElement = document.getElementById('canvas');
        const connectToolButton = document.getElementById('connect-tool');
        const importFileInput = document.getElementById('import-file-input');
        const undoButton = document.getElementById('undo-button');
        const redoButton = document.getElementById('redo-button');


        function captureState() { /* ... */ }
        function restoreState(stateData) { /* ... */ }

        function undo() {
            if (historyStack.length > 1) {
                const currentState = historyStack.pop();
                redoStack.push(currentState);
                const prevState = historyStack[historyStack.length - 1];
                restoreState(prevState);
            }
            updateUndoRedoButtonsState();
        }

        function redo() {
            if (redoStack.length > 0) {
                const nextState = redoStack.pop();
                historyStack.push(nextState);
                restoreState(nextState);
            }
            updateUndoRedoButtonsState();
        }

        function updateUndoRedoButtonsState() {
            undoButton.disabled = historyStack.length <= 1; // Can't undo if only initial state or one action
            redoButton.disabled = redoStack.length === 0;
        }

        // Attach listeners to Undo/Redo buttons
        undoButton.addEventListener('click', undo);
        redoButton.addEventListener('click', redo);


        // --- initApp_singlePageDOM() needs to call updateUndoRedoButtonsState ---
        function initApp_singlePageDOM() {
            updatePropertiesPanel();
            console.log('DOM-based Wireframing tool script loaded (Undo/Redo step 5 - buttons integrated).');
            setTimeout(() => { // Ensure initial state is captured after everything else
                captureState();
                updateUndoRedoButtonsState(); // Set initial button states
            }, 0);
        }

        // --- All other functions (createWireframeElement, event listeners, etc.) ---
        // Ensure captureState() is called appropriately within them as per Step 2.
        // For example, in createWireframeElement:
        // function createWireframeElement(type, loadedConfig = null) {
        //     if(!loadedConfig) captureState(); // Capture before new element creation by user
        //     ...
        //     canvasElement.appendChild(element);
        //     if (!loadedConfig) {
        //        selectElement(...); updatePropertiesPanel();
        //        captureState(); // Capture after new element creation by user
        //     }
        // }
        // And similarly for delete, drag/resize completion, property changes, etc.

        // --- (The rest of the script from the previous full version would go here,
        // ensuring `captureState()` and `updateUndoRedoButtonsState()` are called correctly) ---

        // For brevity, I'm only showing the new/modified parts for Undo/Redo Step 5.
        // The previous full script content should be assumed, with these additions/modifications.
        // Make sure to re-paste the full, correct script content here.
        // The following is a reconstruction of the tail end of the script for completeness:

        const elementConfigs = {
            button: { width: 100, height: 35, text: 'Botón', defaultFillColor: '#ecf0f1', defaultTextColor: '#2c3e50' },
            input: { width: 150, height: 30, text: '', placeholder: 'Escribe aquí...', defaultTextColor: '#2c3e50' },
            text: { width: 120, height: 25, text: 'Texto aquí', defaultTextColor: '#2c3e50' },
            image: { width: 120, height: 80, text: '🖼️', caption: '', defaultTextColor: '#2c3e50' /* For caption */ },
            rectangle: { width: 100, height: 60, text: '', defaultFillColor: 'rgba(52, 152, 219, 0.1)' },
            circle: { width: 80, height: 80, text: '' },
            arrow: { width: 100, height: 20, text: '' },
            menu: { width: 150, height: 100, text: '☰ Menú\n• Opción 1\n• Opción 2', defaultTextColor: '#2c3e50' },
            tab: { width: 200, height: 30, text: 'Tab 1 | Tab 2 | Tab 3', defaultTextColor: '#2c3e50' },
            breadcrumb: { width: 200, height: 25, text: 'Inicio > Página', defaultTextColor: '#2c3e50' }
        };

        document.querySelectorAll('.element-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = e.target.dataset.type;
                if (e.target.id !== 'connect-tool' && e.target.id !== 'add-page-button') {
                    captureState();
                    createWireframeElement(type);
                    // captureState(); // Already done in createWireframeElement for new elements
                }
            });
        });

        // connectToolButton listener remains the same (no captureState needed for mode toggle)

        function getElementRect(element) {return {left: parseFloat(element.style.left),top: parseFloat(element.style.top),width: parseFloat(element.style.width),height: parseFloat(element.style.height)};}
        function getAnchorPointCoordinates(element, anchorType) {
            const rect = getElementRect(element); if(isNaN(rect.left) || isNaN(rect.top) || isNaN(rect.width) || isNaN(rect.height) ) return null;
            switch(anchorType){case 'top': return {x:rect.left+rect.width/2,y:rect.top}; case 'bottom':return{x:rect.left+rect.width/2,y:rect.top+rect.height}; case 'left':return{x:rect.left,y:rect.top+rect.height/2}; case 'right':return{x:rect.left+rect.width,y:rect.top+rect.height/2}; default: return null;}
        }
        function getStaticArrowHandleAbsolutePosition(arrowElement, handleType) {
            const arrowRect = getElementRect(arrowElement); const currentTransform = arrowElement.style.transform; let angleDegrees = 0;
            if(currentTransform && currentTransform.includes('rotate')){const match = currentTransform.match(/rotate\(([-]?\d*\.?\d+)deg\)/); if(match && match[1]){angleDegrees = parseFloat(match[1]);}}
            const arrowAngleRad = angleDegrees * Math.PI / 180; let localX = (handleType === 'start')?0:arrowRect.width; let localY = arrowRect.height/2;
            const pivotXLocal=0; const pivotYLocal = arrowRect.height/2; const translatedX = localX - pivotXLocal; const translatedY = localY - pivotYLocal;
            const rotatedXLocal = translatedX * Math.cos(arrowAngleRad) - translatedY * Math.sin(arrowAngleRad); const rotatedYLocal = translatedX * Math.sin(arrowAngleRad) + translatedY * Math.cos(arrowAngleRad);
            return {x: arrowRect.left + rotatedXLocal + pivotXLocal, y: arrowRect.top + rotatedYLocal + pivotYLocal};
        }
        function getClosestAnchorToPoint(element, mouseX, mouseY) {
            const anchorTypes = ['top','bottom','left','right']; let closestAnchor = null; let minDistance = Infinity; const clickThreshold = 20;
            anchorTypes.forEach(type => {const point = getAnchorPointCoordinates(element, type); if(point){ const distance = Math.sqrt(Math.pow(point.x - mouseX, 2) + Math.pow(point.y - mouseY, 2)); if (distance < minDistance && distance < clickThreshold) { minDistance = distance; closestAnchor = {type,x:point.x,y:point.y};}}}); return closestAnchor;
        }

        canvasElement.addEventListener('click', (e) => {
            const targetElement = e.target.closest('.wireframe-element');
            const canvasRect = canvasElement.getBoundingClientRect();
            const mouseX = e.clientX - canvasRect.left;
            const mouseY = e.clientY - canvasRect.top;

            if (isConnectingMode) {
                if (targetElement) {
                    const closestAnchor = getClosestAnchorToPoint(targetElement, mouseX, mouseY);
                    if (!closestAnchor) {
                        if (startConnectionElementInfo) {
                            startConnectionElementInfo.element.classList.remove('connection-start');
                            startConnectionElementInfo = null;
                        }
                        return;
                    }
                    if (!startConnectionElementInfo) {
                        startConnectionElementInfo = { element: targetElement, anchorType: closestAnchor.type };
                        targetElement.classList.add('connection-start');
                        e.stopPropagation();
                    } else if (startConnectionElementInfo.element !== targetElement) {
                        captureState();
                        createConnection( startConnectionElementInfo.element, startConnectionElementInfo.anchorType, targetElement, closestAnchor.type);
                        startConnectionElementInfo.element.classList.remove('connection-start');
                        startConnectionElementInfo = null;
                        // captureState(); // After connection is made
                    } else {
                        startConnectionElementInfo.element.classList.remove('connection-start');
                        startConnectionElementInfo = null;
                    }
                } else {
                    if (startConnectionElementInfo) {
                        startConnectionElementInfo.element.classList.remove('connection-start');
                        startConnectionElementInfo = null;
                    }
                }
            } else {
                if (e.target === e.currentTarget) {
                    if(selectedElement) captureState(); // Capture if deselecting
                    deselectAll();
                    updatePropertiesPanel();
                }
                // Normal selection is handled in mousedown (startDrag)
            }
        });

        function createWireframeElement(type, loadedConfig = null) {
            // If called by user (not by restoreState/import), capture state before.
            // However, restoreState clears canvas first, then calls this.
            // So, captureState in the direct user action (toolbar click) is better.
            elementCounter++;
            // ... (rest of createWireframeElement as in previous version, including applying styles from loadedConfig)
            // At the end, if (!loadedConfig) { ... captureState(); }
            const config = loadedConfig || elementConfigs[type];
            const element = document.createElement('div');
            element.className = `wireframe-element ${type}-element`;
            element.id = loadedConfig && loadedConfig.id ? loadedConfig.id :`element-${elementCounter}`;
             if (loadedConfig && loadedConfig.id) {
                 const idNum = parseInt(loadedConfig.id.split('-')[1]);
                 if (idNum >= elementCounter) elementCounter = idNum + 1;
            } else if (!loadedConfig) {
                 const idNum = parseInt(element.id.split('-')[1]);
                 if (idNum >= elementCounter) elementCounter = idNum + 1;
            }

            const x = loadedConfig ? config.x : (Math.random() * (canvasElement.offsetWidth - (config.width || 100) - 100) + 50);
            const y = loadedConfig ? config.y : (Math.random() * (canvasElement.offsetHeight - (config.height || 50) - 100) + 50);

            element.style.left = x + 'px';
            element.style.top = y + 'px';
            element.style.width = (config.width || elementConfigs[type].width) + 'px';
            element.style.height = (config.height || elementConfigs[type].height) + 'px';
            element.dataset.type = type;

            element.style.textAlign = config.textAlign || '';
            element.style.fontFamily = config.fontFamily || '';
            element.style.fontSize = config.fontSize || '';
            element.style.color = config.textColor || '';
            element.style.backgroundColor = config.fillColor || '';

            const initialRotation = loadedConfig ? (config.rotation || 0) : (type === 'arrow' ? (config.rotation || 0) : null);
            if (initialRotation !== null && initialRotation !== undefined) {
                 element.style.transform = `rotate(${initialRotation}deg)`;
                 element.dataset.rotation = initialRotation;
            }
            if (loadedConfig && loadedConfig.connectsFromId) element.dataset.connectsFromId = loadedConfig.connectsFromId;
            if (loadedConfig && loadedConfig.connectsToId) element.dataset.connectsToId = loadedConfig.connectsToId;
            if (loadedConfig && loadedConfig.caption) element.dataset.caption = loadedConfig.caption; // For image
            if (loadedConfig && loadedConfig.text && type==='input') { // For input text value
                 // Handled below by setting inputField.value
            } else if (loadedConfig && loadedConfig.text) {
                element.textContent = loadedConfig.text;
            }


            if (type === 'arrow') {
                element.innerHTML = `...`; // SVG code (same as before)
                const handleStart = document.createElement('div'); handleStart.className = 'connection-handle start'; handleStart.dataset.handleType = 'start';
                handleStart.addEventListener('mousedown', onStaticArrowHandleMouseDown); element.appendChild(handleStart);
                const handleEnd = document.createElement('div'); handleEnd.className = 'connection-handle end'; handleEnd.dataset.handleType = 'end';
                handleEnd.addEventListener('mousedown', onStaticArrowHandleMouseDown); element.appendChild(handleEnd);
            } else if (type === 'input') {
                const inputField = document.createElement('input'); inputField.className = 'input-field'; inputField.type = 'text';
                inputField.placeholder = config.placeholder || elementConfigs[type].placeholder;
                inputField.value = config.text || ''; // 'text' from config is the value for input
                if(element.style.color) inputField.style.color = element.style.color;
                inputField.addEventListener('mousedown', (e) => e.stopPropagation()); inputField.addEventListener('click', (e) => e.stopPropagation());
                element.appendChild(inputField);
            } else if (type === 'circle') {
                element.style.borderRadius = '50%'; element.textContent = config.text || elementConfigs[type].text;
            } else if (type === 'image') {
                element.dataset.caption = config.caption || config.text || '';
                const iconSpan = document.createElement('span'); iconSpan.textContent = elementConfigs.image.text;
                element.appendChild(iconSpan);
                if (element.dataset.caption) {
                    const captionSpan = document.createElement('span'); captionSpan.className = 'caption';
                    captionSpan.textContent = element.dataset.caption;
                    if(element.style.color) captionSpan.style.color = element.style.color;
                    element.appendChild(captionSpan);
                }
            } else {
                element.textContent = config.text || elementConfigs[type].text;
                if (type === 'menu' || type === 'breadcrumb' || type === 'paragraph' || (type === 'text' && element.textContent.includes('\n'))) {
                    element.style.whiteSpace = 'pre-line';
                }
                if (type === 'menu') { element.style.fontSize = '11px'; element.style.padding = '8px';}
            }

            const deleteBtn = document.createElement('button'); deleteBtn.className = 'delete-btn'; deleteBtn.innerHTML = '×';
            deleteBtn.onclick = (e) => {
                captureState();
                e.stopPropagation();
                const elToRemove = element;
                const idToRemove = elToRemove.id;
                elToRemove.remove();
                if(selectedElement === elToRemove) { deselectAll(); updatePropertiesPanel(); }
                connections.slice().reverse().forEach((conn) => {
                    if (conn.fromId === idToRemove || conn.toId === idToRemove) {
                        if (conn.arrowSvgElement) conn.arrowSvgElement.remove();
                        connections.splice(connections.indexOf(conn), 1);
                    }
                });
                document.querySelectorAll('.arrow-element').forEach(arrow => {
                    let changed = false;
                    if (arrow.dataset.connectsFromId === idToRemove) { delete arrow.dataset.connectsFromId; changed = true; }
                    if (arrow.dataset.connectsToId === idToRemove) { delete arrow.dataset.connectsToId; changed = true; }
                    if (changed) updateStaticArrowConnection(arrow);
                });
                captureState();
            };
            element.appendChild(deleteBtn);

            if (type !== 'arrow') {
                const resizeHandle = document.createElement('div'); resizeHandle.className = 'resize-handle';
                element.appendChild(resizeHandle); resizeHandle.addEventListener('mousedown', startResize);
            }
            element.addEventListener('mousedown', startDrag); element.addEventListener('dblclick', editText);
            canvasElement.appendChild(element);
            if (!loadedConfig) {
                selectElement({ target: element, stopPropagation: () => {} }, false);
                updatePropertiesPanel();
                captureState(); // Capture after new element fully added by user
            }
        }
