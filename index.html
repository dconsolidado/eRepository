<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .toolbar {
            width: 200px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }

        .toolbar h3 {
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            color: #bdc3c7;
        }

        .element-group {
            margin-bottom: 20px;
        }

        .element-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .element-btn:hover {
            background: #3498db;
        }

        .tool-btn {
            background: #1abc9c;
        }
        .tool-btn:hover {
            background: #16a085;
        }
        .tool-btn.active {
            background: #16a085;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }


        .canvas-container {
            flex: 1;
            position: relative;
            background: white;
            overflow: hidden;
        }

        .canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background:
                radial-gradient(circle, #ddd 1px, transparent 1px);
            background-size: 20px 20px;
            cursor: default;
        }
        .canvas.connecting-mode { /* For dynamic SVG connectors */
            cursor: crosshair;
        }
        .canvas.connecting-mode .wireframe-element:hover {
             cursor: pointer;
             border-color: #1abc9c !important;
        }
        .canvas.linking-arrow-handle { /* For dragging static arrow handles */
            cursor: grabbing;
        }


        .wireframe-element {
            position: absolute;
            border: 2px solid #3498db;
            background: rgba(52, 152, 219, 0.1);
            cursor: move;
            user-select: none;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #2c3e50;
            font-weight: bold;
            overflow: hidden;
        }

        .wireframe-element:hover {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        .wireframe-element.selected {
            border-color: #e74c3c !important;
            background: rgba(231, 76, 60, 0.2);
            z-index: 10;
        }
        .wireframe-element.connection-start { /* For dynamic SVG connectors */
            box-shadow: 0 0 10px #1abc9c;
            border-color: #1abc9c !important;
        }


        .button-element {
            border-radius: 6px;
            background: #ecf0f1;
            border: 2px solid #95a5a6;
            text-align: center;
            line-height: 1;
        }

        .text-element {
            border: 2px dashed #95a5a6;
            background: transparent;
            text-align: left;
            padding: 5px;
            line-height: 1.2;
            align-items: flex-start;
        }

        .paragraph-element {
            border: 2px dashed #7f8c8d;
            background: transparent;
            text-align: left;
            padding: 5px;
            line-height: 1.2;
            align-items: flex-start;
            white-space: pre-wrap;
        }


        .input-element {
            border: 2px solid #bdc3c7;
            background: white;
            border-radius: 2px;
            padding: 0;
            text-align: left;
            overflow: hidden;
            display: flex;
        }

        .input-field {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 5px;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
            resize: none;
        }

        .image-element {
            border: 2px solid #95a5a6;
            background: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #7f8c8d;
            text-align: center;
        }
        .image-element .caption {
            font-size: 0.7em;
            font-weight: normal;
            margin-top: 5px;
            color: #2c3e50;
        }


        .arrow-element {
            border: none;
            background: transparent;
            transform-origin: 0 50%;
        }
        .arrow-element .arrow-svg-static {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
        .arrow-element .arrow-svg-static line {
             stroke-width: 2;
             stroke: #2c3e50;
        }
        .arrow-element .arrow-svg-static polygon {
            fill: #2c3e50;
        }

        .connector-arrow-svg {
            position: absolute;
            overflow: visible;
            pointer-events: none;
            z-index: 5;
        }
        .connector-arrow-svg line {
            stroke: #2c3e50;
            stroke-width: 2;
        }
         .connector-arrow-svg polygon {
            fill: #2c3e50;
        }

        #linking-preview-line {
            stroke: #007bff;
            stroke-width: 1.5;
            stroke-dasharray: 4, 4;
        }


        .connection-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: green;
            border: 1px solid darkgreen;
            border-radius: 50%;
            cursor: grab;
            z-index: 20;
            display: none;
        }
        .wireframe-element.selected.arrow-element .connection-handle {
            display: block;
        }
        .arrow-element .connection-handle.start {
            left: -5px;
            top: 50%;
            transform: translateY(-50%);
        }
        .arrow-element .connection-handle.end {
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
        }


        .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            display: none;
            z-index: 15;
        }

        .wireframe-element.selected .delete-btn {
            display: block;
        }

        .resize-handle {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 10px;
            height: 10px;
            background: #3498db;
            cursor: se-resize;
            display: none;
            z-index: 15;
        }

        .wireframe-element.selected:not(.arrow-element) .resize-handle {
            display: block;
        }


        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
         .controls .file-input-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .controls input[type="file"] {
            display: none;
        }
        .controls .file-label-btn {
            padding: 8px 12px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .controls .file-label-btn:hover {
            background: #d35400;
        }


        .control-btn {
            padding: 8px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .control-btn:hover {
            background: #2980b9;
        }

        .properties-sidebar {
            width: 220px;
            background: #ecf0f1;
            padding: 15px;
            border-left: 1px solid #bdc3c7;
            overflow-y: auto;
            color: #2c3e50;
        }
        .properties-sidebar h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            color: #7f8c8d;
            border-bottom: 1px solid #bdc3c7;
            padding-bottom: 10px;
        }
        .prop-group {
            margin-bottom:15px;
        }
        .prop-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .prop-group input[type="number"],
        .prop-group input[type="text"],
        .prop-group select,
        .prop-group button {
            width: 100%;
            padding: 6px;
            border-radius: 3px;
            border: 1px solid #bdc3c7;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .prop-group button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }
         .prop-group button:hover {
            background-color: #2980b9;
        }
        .alignment-buttons button {
            width: auto;
            padding: 5px 8px;
            margin-right: 5px;
        }
        .page-action-button {
             font-size: 0.8em !important;
             padding: 2px 5px !important;
             margin-left: 5px !important;
             background-color: #7f8c8d !important;
        }
        .page-action-button:hover {
            background-color: #95a5a6 !important;
        }
        .page-delete-button {
            background-color: #c0392b !important;
        }
        .page-delete-button:hover {
            background-color: #e74c3c !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <h3>Páginas</h3>
            <ul id="pages-list" style="list-style-type: none; padding: 0; margin-bottom:10px; max-height: 100px; overflow-y:auto;">
            </ul>
            <button id="add-page-button" class="element-btn" style="background-color: #27ae60; margin-bottom:20px;">+ Nueva Página</button>

            <h3>Elementos UI</h3>
            <div class="element-group">
                <button class="element-btn" data-type="button">📱 Botón</button>
                <button class="element-btn" data-type="input">📝 Campo de texto</button>
                <button class="element-btn" data-type="text">📄 Texto</button>
                <button class="element-btn" data-type="image">🖼️ Imagen</button>
            </div>

            <h3>Formas</h3>
            <div class="element-group">
                <button class="element-btn" data-type="rectangle">⬜ Rectángulo</button>
                <button class="element-btn" data-type="circle">⭕ Círculo</button>
                <button class="element-btn" data-type="arrow">➡️ Flecha (Estática)</button>
            </div>

            <h3>Navegación</h3>
            <div class="element-group">
                <button class="element-btn" data-type="menu">☰ Menú</button>
                <button class="element-btn" data-type="tab">📋 Pestañas</button>
                <button class="element-btn" data-type="breadcrumb">🔗 Breadcrumb</button>
            </div>

            <h3>Herramientas</h3>
            <div class="element-group">
                <button class="element-btn tool-btn" id="connect-tool">🔗 Conectar Elementos</button>
            </div>
        </div>

        <div class="canvas-container">
            <div class="controls">
                <button class="control-btn" onclick="clearCanvas()">🗑️ Limpiar</button>
                <button class="control-btn" onclick="exportWireframe()">💾 Exportar</button>
                <div class="file-input-group">
                    <label for="import-file-input" class="control-btn file-label-btn">📥 Importar</label>
                    <input type="file" id="import-file-input" accept=".json">
                </div>
            </div>
            <div class="canvas" id="canvas">
                 <svg id="linking-preview-svg" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 99;">
                    <line id="linking-preview-line" stroke="#007bff" stroke-width="1.5" stroke-dasharray="4,4" style="display:none;" />
                </svg>
            </div>
        </div>

        <div class="properties-sidebar" id="properties-panel">
            <h3>Propiedades</h3>
            <div id="props-content-area">
                <p>Selecciona un elemento.</p>
            </div>
        </div>
    </div>

    <script>
        let selectedElement = null;
        let isDragging = false;
        let isResizing = false;
        let dragOffset = { x: 0, y: 0 };
        let elementCounter = 0;

        let isConnectingMode = false;
        let startConnectionElementInfo = null;
        const connections = [];

        let isLinkingStaticArrowHandle = null;
        const linkingPreviewLine = document.getElementById('linking-preview-line');


        const elementConfigs = {
            button: { width: 100, height: 35, text: 'Botón' },
            input: { width: 150, height: 30, text: '', placeholder: 'Escribe aquí...' },
            text: { width: 120, height: 25, text: 'Texto aquí' },
            image: { width: 120, height: 80, text: '🖼️', caption: '' },
            rectangle: { width: 100, height: 60, text: '' },
            circle: { width: 80, height: 80, text: '' },
            arrow: { width: 100, height: 20, text: '' },
            menu: { width: 150, height: 100, text: '☰ Menú\n• Opción 1\n• Opción 2' },
            tab: { width: 200, height: 30, text: 'Tab 1 | Tab 2 | Tab 3' },
            breadcrumb: { width: 200, height: 25, text: 'Inicio > Página' }
        };

        const propsContentArea = document.getElementById('props-content-area');
        const canvasElement = document.getElementById('canvas');
        const connectToolButton = document.getElementById('connect-tool');
        const importFileInput = document.getElementById('import-file-input');

        document.querySelectorAll('.element-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = e.target.dataset.type;
                if (e.target.id !== 'connect-tool' && e.target.id !== 'add-page-button') {
                    createWireframeElement(type);
                }
            });
        });

        connectToolButton.addEventListener('click', (e) => {
            isConnectingMode = !isConnectingMode;
            e.target.classList.toggle('active', isConnectingMode);
            canvasElement.classList.toggle('connecting-mode', isConnectingMode);
            if (!isConnectingMode && startConnectionElementInfo) {
                startConnectionElementInfo.element.classList.remove('connection-start');
                startConnectionElementInfo = null;
            } else if (isConnectingMode) {
                deselectAll();
                updatePropertiesPanel();
            }
        });

        function getElementRect(element) {
            return {
                left: parseFloat(element.style.left),
                top: parseFloat(element.style.top),
                width: parseFloat(element.style.width),
                height: parseFloat(element.style.height)
            };
        }

        function getAnchorPointCoordinates(element, anchorType) {
            const rect = getElementRect(element);
            if(isNaN(rect.left) || isNaN(rect.top) || isNaN(rect.width) || isNaN(rect.height) ) return null;
            switch (anchorType) {
                case 'top': return { x: rect.left + rect.width / 2, y: rect.top };
                case 'bottom': return { x: rect.left + rect.width / 2, y: rect.top + rect.height };
                case 'left': return { x: rect.left, y: rect.top + rect.height / 2 };
                case 'right': return { x: rect.left + rect.width, y: rect.top + rect.height / 2 };
                default: return null;
            }
        }

        function getStaticArrowHandleAbsolutePosition(arrowElement, handleType) {
            const arrowRect = getElementRect(arrowElement);
            const currentTransform = arrowElement.style.transform;
            let angleDegrees = 0;
            if (currentTransform && currentTransform.includes('rotate')) {
                const match = currentTransform.match(/rotate\(([-]?\d*\.?\d+)deg\)/);
                if (match && match[1]) {
                    angleDegrees = parseFloat(match[1]);
                }
            }
            const arrowAngleRad = angleDegrees * Math.PI / 180;

            let localX = (handleType === 'start') ? 0 : arrowRect.width;
            let localY = arrowRect.height / 2;

            const pivotXLocal = 0;
            const pivotYLocal = arrowRect.height / 2;

            const translatedX = localX - pivotXLocal;
            const translatedY = localY - pivotYLocal;

            const rotatedXLocal = translatedX * Math.cos(arrowAngleRad) - translatedY * Math.sin(arrowAngleRad);
            const rotatedYLocal = translatedX * Math.sin(arrowAngleRad) + translatedY * Math.cos(arrowAngleRad);

            return {
                x: arrowRect.left + rotatedXLocal + pivotXLocal,
                y: arrowRect.top + rotatedYLocal + pivotYLocal
            };
        }


        function getClosestAnchorToPoint(element, mouseX, mouseY) {
            const anchorTypes = ['top', 'bottom', 'left', 'right'];
            let closestAnchor = null;
            let minDistance = Infinity;
            const clickThreshold = 20;
            anchorTypes.forEach(type => {
                const point = getAnchorPointCoordinates(element, type);
                if (point) {
                    const distance = Math.sqrt(Math.pow(point.x - mouseX, 2) + Math.pow(point.y - mouseY, 2));
                    if (distance < minDistance && distance < clickThreshold) {
                        minDistance = distance;
                        closestAnchor = { type, x: point.x, y: point.y };
                    }
                }
            });
            return closestAnchor;
        }


        canvasElement.addEventListener('click', (e) => {
            const targetElement = e.target.closest('.wireframe-element');
            const canvasRect = canvasElement.getBoundingClientRect();
            const mouseX = e.clientX - canvasRect.left;
            const mouseY = e.clientY - canvasRect.top;

            if (isConnectingMode) {
                if (targetElement) {
                    const closestAnchor = getClosestAnchorToPoint(targetElement, mouseX, mouseY);
                    if (!closestAnchor) {
                        if (startConnectionElementInfo) {
                            startConnectionElementInfo.element.classList.remove('connection-start');
                            startConnectionElementInfo = null;
                        }
                        return;
                    }
                    if (!startConnectionElementInfo) {
                        startConnectionElementInfo = { element: targetElement, anchorType: closestAnchor.type };
                        targetElement.classList.add('connection-start');
                        e.stopPropagation();
                    } else if (startConnectionElementInfo.element !== targetElement) {
                        createConnection(
                            startConnectionElementInfo.element,
                            startConnectionElementInfo.anchorType,
                            targetElement,
                            closestAnchor.type
                        );
                        startConnectionElementInfo.element.classList.remove('connection-start');
                        startConnectionElementInfo = null;
                    } else {
                        startConnectionElementInfo.element.classList.remove('connection-start');
                        startConnectionElementInfo = null;
                    }
                } else {
                    if (startConnectionElementInfo) {
                        startConnectionElementInfo.element.classList.remove('connection-start');
                        startConnectionElementInfo = null;
                    }
                }
            } else {
                if (e.target === e.currentTarget) {
                    deselectAll();
                    updatePropertiesPanel();
                }
            }
        });

        function createWireframeElement(type, loadedConfig = null) {
            elementCounter++;
            const config = loadedConfig || elementConfigs[type];
            const element = document.createElement('div');
            element.className = `wireframe-element ${type}-element`;
            element.id = loadedConfig && loadedConfig.id ? loadedConfig.id :`element-${elementCounter}`;
             if (loadedConfig && loadedConfig.id) { // Ensure elementCounter is ahead of loaded IDs
                const idNum = parseInt(loadedConfig.id.split('-')[1]);
                if (idNum >= elementCounter) elementCounter = idNum + 1;
            } else if (!loadedConfig) {
                 const idNum = parseInt(element.id.split('-')[1]);
                 if (idNum >= elementCounter) elementCounter = idNum + 1;
            }


            const x = loadedConfig ? config.x : (Math.random() * (canvasElement.offsetWidth - (config.width || 100) - 100) + 50);
            const y = loadedConfig ? config.y : (Math.random() * (canvasElement.offsetHeight - (config.height || 50) - 100) + 50);

            element.style.left = x + 'px';
            element.style.top = y + 'px';
            element.style.width = (config.width || elementConfigs[type].width) + 'px';
            element.style.height = (config.height || elementConfigs[type].height) + 'px';
            element.dataset.type = type;

            element.style.textAlign = config.textAlign || (type === 'button' ? 'center' : 'left');
            element.style.fontFamily = config.fontFamily || 'Arial, sans-serif';
            element.style.fontSize = config.fontSize || (elementConfigs[type].fontSize || 12) + 'px';

            const initialRotation = loadedConfig ? (config.rotation || 0) : (type === 'arrow' ? 0 : null);
            if (initialRotation !== null) {
                 element.style.transform = `rotate(${initialRotation}deg)`;
                 element.dataset.rotation = initialRotation;
            }
            if (loadedConfig && loadedConfig.connectsFromId) element.dataset.connectsFromId = loadedConfig.connectsFromId;
            if (loadedConfig && loadedConfig.connectsToId) element.dataset.connectsToId = loadedConfig.connectsToId;


            if (type === 'arrow') {
                element.innerHTML = `
                    <svg class="arrow-svg-static" viewBox="0 0 100 20" preserveAspectRatio="none">
                        <defs>
                            <marker id="arrowhead-static-${element.id}" markerWidth="10" markerHeight="7"
                                refX="10" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" />
                            </marker>
                        </defs>
                        <line x1="0" y1="10" x2="90" y2="10" marker-end="url(#arrowhead-static-${element.id})" />
                    </svg>
                `;
                const handleStart = document.createElement('div');
                handleStart.className = 'connection-handle start';
                handleStart.dataset.handleType = 'start';
                handleStart.addEventListener('mousedown', onStaticArrowHandleMouseDown);
                element.appendChild(handleStart);

                const handleEnd = document.createElement('div');
                handleEnd.className = 'connection-handle end';
                handleEnd.dataset.handleType = 'end';
                handleEnd.addEventListener('mousedown', onStaticArrowHandleMouseDown);
                element.appendChild(handleEnd);

            } else if (type === 'input') {
                const inputField = document.createElement('input');
                inputField.className = 'input-field'; inputField.type = 'text';
                inputField.placeholder = config.placeholder || elementConfigs[type].placeholder;
                inputField.value = config.text || '';
                inputField.addEventListener('mousedown', (e) => e.stopPropagation());
                inputField.addEventListener('click', (e) => e.stopPropagation());
                element.appendChild(inputField);
            } else if (type === 'circle') {
                element.style.borderRadius = '50%';
                element.textContent = config.text || elementConfigs[type].text;
            } else if (type === 'image') {
                element.dataset.caption = config.caption || config.text || '';
                const iconSpan = document.createElement('span');
                iconSpan.textContent = elementConfigs.image.text;
                element.appendChild(iconSpan);
                if (element.dataset.caption) {
                    const captionSpan = document.createElement('span');
                    captionSpan.className = 'caption';
                    captionSpan.textContent = element.dataset.caption;
                    element.appendChild(captionSpan);
                }
            }
             else {
                element.textContent = config.text || elementConfigs[type].text;
                if (type === 'menu' || type === 'breadcrumb' || type === 'paragraph' || (type === 'text' && element.textContent.includes('\n'))) {
                    element.style.whiteSpace = 'pre-line';
                }
                 if (type === 'menu') {
                    element.style.fontSize = '11px'; element.style.padding = '8px';
                }
            }

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn'; deleteBtn.innerHTML = '×';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                const elToRemove = element;
                const idToRemove = elToRemove.id;
                elToRemove.remove();
                if(selectedElement === elToRemove) {
                    deselectAll();
                    updatePropertiesPanel();
                }
                connections.slice().reverse().forEach((conn) => {
                    if (conn.fromId === idToRemove || conn.toId === idToRemove) {
                        if (conn.arrowSvgElement) conn.arrowSvgElement.remove();
                        connections.splice(connections.indexOf(conn), 1);
                    }
                });
                document.querySelectorAll('.arrow-element').forEach(arrow => {
                    let changed = false;
                    if (arrow.dataset.connectsFromId === idToRemove) {
                        delete arrow.dataset.connectsFromId;
                        changed = true;
                    }
                    if (arrow.dataset.connectsToId === idToRemove) {
                        delete arrow.dataset.connectsToId;
                        changed = true;
                    }
                    if (changed) updateStaticArrowConnection(arrow);
                });
            };
            element.appendChild(deleteBtn);

            if (type !== 'arrow') {
                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'resize-handle';
                element.appendChild(resizeHandle);
                resizeHandle.addEventListener('mousedown', startResize);
            }
            element.addEventListener('mousedown', startDrag);
            element.addEventListener('dblclick', editText);
            canvasElement.appendChild(element);
            if (!loadedConfig) {
                selectElement({ target: element, stopPropagation: () => {} }, false);
                updatePropertiesPanel();
            }
            // const idNum = parseInt(element.id.split('-')[1]); // Already handled for new elements
            // if (idNum >= elementCounter) {
            //     elementCounter = idNum + 1;
            // }
        }

        function onStaticArrowHandleMouseDown(e) {
            e.stopPropagation();
            const arrowElement = e.target.closest('.arrow-element');
            const handleType = e.target.dataset.handleType;
            isLinkingStaticArrowHandle = { arrowElement, handleType };

            canvasElement.classList.add('linking-arrow-handle');
            linkingPreviewLine.style.display = 'block';

            document.addEventListener('mousemove', onStaticArrowHandleMouseMove);
            document.addEventListener('mouseup', onStaticArrowHandleMouseUp);
        }

        function onStaticArrowHandleMouseMove(e) {
            if (!isLinkingStaticArrowHandle) return;
            const canvasRect = canvasElement.getBoundingClientRect();
            const mouseX = e.clientX - canvasRect.left;
            const mouseY = e.clientY - canvasRect.top;

            const arrowElem = isLinkingStaticArrowHandle.arrowElement;
            const handleType = isLinkingStaticArrowHandle.handleType;

            const otherHandleType = (handleType === 'start') ? 'end' : 'start';
            const fixedPoint = getStaticArrowHandleAbsolutePosition(arrowElem, otherHandleType);

            if (fixedPoint) {
                linkingPreviewLine.setAttribute('x1', fixedPoint.x);
                linkingPreviewLine.setAttribute('y1', fixedPoint.y);
                linkingPreviewLine.setAttribute('x2', mouseX);
                linkingPreviewLine.setAttribute('y2', mouseY);
            }
        }

        function onStaticArrowHandleMouseUp(e) {
            if (!isLinkingStaticArrowHandle) return;

            linkingPreviewLine.style.display = 'none';
            canvasElement.classList.remove('linking-arrow-handle');

            const arrowElement = isLinkingStaticArrowHandle.arrowElement;
            const handleType = isLinkingStaticArrowHandle.handleType;

            arrowElement.style.pointerEvents = 'none';
            const targetElement = document.elementFromPoint(e.clientX, e.clientY)?.closest('.wireframe-element');
            arrowElement.style.pointerEvents = 'auto';

            if (targetElement && targetElement !== arrowElement) {
                if (handleType === 'start') {
                    arrowElement.dataset.connectsFromId = targetElement.id;
                } else {
                    arrowElement.dataset.connectsToId = targetElement.id;
                }
            } else {
                if (handleType === 'start') delete arrowElement.dataset.connectsFromId;
                else delete arrowElement.dataset.connectsToId;
            }

            updateStaticArrowConnection(arrowElement);

            document.removeEventListener('mousemove', onStaticArrowHandleMouseMove);
            document.removeEventListener('mouseup', onStaticArrowHandleMouseUp);
            isLinkingStaticArrowHandle = null;
        }

        function updateStaticArrowConnection(arrowElement) {
            const fromId = arrowElement.dataset.connectsFromId;
            const toId = arrowElement.dataset.connectsToId;

            let p1, p2;
            const arrowRect = getElementRect(arrowElement);

            if (fromId) {
                const fromElement = document.getElementById(fromId);
                if (fromElement) {
                    const fromRect = getElementRect(fromElement);
                    p1 = { x: fromRect.left + fromRect.width / 2, y: fromRect.top + fromRect.height / 2 };
                } else {
                     delete arrowElement.dataset.connectsFromId;
                     p1 = getStaticArrowHandleAbsolutePosition(arrowElement, 'start');
                }
            } else {
                 p1 = getStaticArrowHandleAbsolutePosition(arrowElement, 'start');
            }

            if (toId) {
                const toElement = document.getElementById(toId);
                if (toElement) {
                    const toRect = getElementRect(toElement);
                    p2 = { x: toRect.left + toRect.width / 2, y: toRect.top + toRect.height / 2 };
                } else {
                    delete arrowElement.dataset.connectsToId;
                    p2 = getStaticArrowHandleAbsolutePosition(arrowElement, 'end');
                }
            } else {
                p2 = getStaticArrowHandleAbsolutePosition(arrowElement, 'end');
            }

            if (!p1 || !p2) return;

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            arrowElement.style.width = length + 'px';
            arrowElement.style.left = p1.x + 'px';
            arrowElement.style.top = p1.y - (parseFloat(arrowElement.style.height) / 2) + 'px';
            arrowElement.style.transform = `rotate(${angle}deg)`;
            arrowElement.dataset.rotation = angle;

            const svgLine = arrowElement.querySelector('.arrow-svg-static line');
            if (svgLine) {
                const lineEndX = Math.max(0, length - 10);
                svgLine.setAttribute('x1', '0');
                svgLine.setAttribute('y1', '10');
                svgLine.setAttribute('x2', lineEndX);
                svgLine.setAttribute('y2', '10');
            }
            if(selectedElement === arrowElement) updatePropertiesPanel();
        }

        function updateStaticArrowConnectionsForElement(movedElement) {
            document.querySelectorAll('.arrow-element').forEach(arrow => {
                if (arrow.dataset.connectsFromId === movedElement.id || arrow.dataset.connectsToId === movedElement.id) {
                    updateStaticArrowConnection(arrow);
                }
            });
        }

        function createConnection(fromElement, fromAnchorType, toElement, toAnchorType) {
            const svgNS = "http://www.w3.org/2000/svg";
            const arrowSvg = document.createElementNS(svgNS, "svg");
            const uniqueArrowIdPart = connections.length + 1 + Date.now();
            const arrowId = `connector-arrow-${uniqueArrowIdPart}`;
            arrowSvg.setAttribute("id", arrowId);
            arrowSvg.classList.add("connector-arrow-svg");
            const line = document.createElementNS(svgNS, "line");
            const defs = document.createElementNS(svgNS, "defs");
            const marker = document.createElementNS(svgNS, "marker");
            const markerId = `arrowhead-conn-${uniqueArrowIdPart}`;
            marker.setAttribute("id", markerId);
            marker.setAttribute("markerWidth", "10"); marker.setAttribute("markerHeight", "7");
            marker.setAttribute("refX", "8"); marker.setAttribute("refY", "3.5");
            marker.setAttribute("orient", "auto"); marker.setAttribute("markerUnits", "strokeWidth");
            const polygon = document.createElementNS(svgNS, "polygon");
            polygon.setAttribute("points", "0 0, 10 3.5, 0 7");
            marker.appendChild(polygon); defs.appendChild(marker);
            arrowSvg.appendChild(defs);
            line.setAttribute("marker-end", `url(#${markerId})`);
            arrowSvg.appendChild(line);
            canvasElement.appendChild(arrowSvg);
            const connection = {
                fromId: fromElement.id, fromAnchorType: fromAnchorType,
                toId: toElement.id, toAnchorType: toAnchorType,
                arrowSvgElement: arrowSvg, lineElement: line
            };
            connections.push(connection);
            updateConnectionArrow(connection);
        }

        function updateConnectionArrow(connection) {
             const fromEl = document.getElementById(connection.fromId);
             const toEl = document.getElementById(connection.toId);
             if (!fromEl || !toEl) {
                 if (connection.arrowSvgElement) connection.arrowSvgElement.remove();
                 const connIndex = connections.indexOf(connection);
                 if (connIndex > -1) connections.splice(connIndex, 1);
                 return;
             }

             const startCoords = getAnchorPointCoordinates(fromEl, connection.fromAnchorType);
             const endCoords = getAnchorPointCoordinates(toEl, connection.toAnchorType);

             if (!startCoords || !endCoords) return;

             const line = connection.lineElement;
             line.setAttribute("x1", startCoords.x);
             line.setAttribute("y1", startCoords.y);
             line.setAttribute("x2", endCoords.x);
             line.setAttribute("y2", endCoords.y);

             connection.arrowSvgElement.style.left = '0px'; connection.arrowSvgElement.style.top = '0px';
             connection.arrowSvgElement.style.width = '100%'; connection.arrowSvgElement.style.height = '100%';
        }

        function updateAllConnections() { connections.forEach(conn => updateConnectionArrow(conn)); }

        function startDrag(e) {
            if (e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-btn') ||
                e.target.classList.contains('connection-handle') ||
                e.target.tagName === 'INPUT' || isConnectingMode || isLinkingStaticArrowHandle) return;
            isDragging = true;
            const targetElement = e.currentTarget;
            if (selectedElement !== targetElement) {
                selectElement({ target: targetElement, stopPropagation: () => {} });
            }
            if (!selectedElement) return;
            const rect = selectedElement.getBoundingClientRect();
            const canvasRect = canvasElement.getBoundingClientRect();
            dragOffset.x = e.clientX - (rect.left - canvasRect.left);
            dragOffset.y = e.clientY - (rect.top - canvasRect.top);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging || !selectedElement) return;
            const canvasRect = canvasElement.getBoundingClientRect();
            const x = e.clientX - dragOffset.x;
            const y = e.clientY - dragOffset.y;
            selectedElement.style.left = Math.max(0, Math.min(x, canvasRect.width - selectedElement.offsetWidth)) + 'px';
            selectedElement.style.top = Math.max(0, Math.min(y, canvasRect.height - selectedElement.offsetHeight)) + 'px';
            updateAllConnections();
            updateStaticArrowConnectionsForElement(selectedElement);
            updatePropertiesPanel();
        }

        function stopDrag() { isDragging = false; document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', stopDrag); }
        function startResize(e) { e.stopPropagation(); isResizing = true; selectedElement = e.target.parentElement; document.addEventListener('mousemove', resize); document.addEventListener('mouseup', stopResize); }
        function resize(e) {
            if (!isResizing || !selectedElement) return;
            const elementRect = selectedElement.getBoundingClientRect(); const canvasRect = canvasElement.getBoundingClientRect();
            let newWidth = e.clientX - elementRect.left; let newHeight = e.clientY - elementRect.top;
            newWidth = Math.min(newWidth, canvasRect.width - parseFloat(selectedElement.style.left));
            newHeight = Math.min(newHeight, canvasRect.height - parseFloat(selectedElement.style.top));
            selectedElement.style.width = Math.max(20, newWidth) + 'px'; selectedElement.style.height = Math.max(20, newHeight) + 'px';
            updateAllConnections(); updateStaticArrowConnectionsForElement(selectedElement); updatePropertiesPanel();
        }
        function stopResize() { isResizing = false; document.removeEventListener('mousemove', resize); document.removeEventListener('mouseup', stopResize); }
        function selectElement(e, shouldUpdatePanel = true) {
            e.stopPropagation(); const targetElement = e.target.closest('.wireframe-element');
            if (isConnectingMode || isLinkingStaticArrowHandle) return;
            deselectAll();
            if (targetElement) { selectedElement = targetElement; selectedElement.classList.add('selected');}
            if (shouldUpdatePanel) updatePropertiesPanel();
        }
        function deselectAll() {
            document.querySelectorAll('.wireframe-element.selected').forEach(el => el.classList.remove('selected'));
            if (startConnectionElementInfo) startConnectionElementInfo.element.classList.remove('connection-start');
            selectedElement = null;
        }
        function editText(e) { /* ... (no changes) ... */ }
        function updatePropertiesPanel() {
            propsContentArea.innerHTML = '';
            if (!selectedElement) { propsContentArea.innerHTML = '<p>Selecciona un elemento.</p>'; return; }
            const type = selectedElement.dataset.type;
            let html = `<div class="prop-group"><label>Tipo:</label> <p>${type.charAt(0).toUpperCase() + type.slice(1)}</p></div>`;
            html += `<div class="prop-group"><label>ID:</label> <p>${selectedElement.id}</p></div>`;
            html += `<div class="prop-group"><label>X:</label> <p>${parseInt(selectedElement.style.left)}px</p></div>`;
            html += `<div class="prop-group"><label>Y:</label> <p>${parseInt(selectedElement.style.top)}px</p></div>`;
            html += `<div class="prop-group"><label>Ancho:</label> <p>${parseInt(selectedElement.style.width)}px</p></div>`;
            html += `<div class="prop-group"><label>Alto:</label> <p>${parseInt(selectedElement.style.height)}px</p></div>`;
            const textSupportingTypes = ['button', 'text', 'input', 'paragraph', 'menu', 'tab', 'breadcrumb'];
            if (textSupportingTypes.includes(type) && type !== 'image') {
                html += `<div class="prop-group alignment-buttons"><label>Alineación:</label>`;
                html += `<button data-align="left">Izq</button> <button data-align="center">Cen</button> <button data-align="right">Der</button></div>`;
                html += `<div class="prop-group"><label for="font-family-select">Fuente:</label>
                         <select id="font-family-select">
                             <option value="Arial, sans-serif" ${(!selectedElement.style.fontFamily || selectedElement.style.fontFamily === "Arial, sans-serif" || selectedElement.style.fontFamily === "Arial") ? "selected" : ""}>Arial</option>
                             <option value="Comic Sans MS, cursive" ${selectedElement.style.fontFamily === "Comic Sans MS, cursive" ? "selected" : ""}>Comic Sans</option>
                             <option value="Verdana, sans-serif" ${selectedElement.style.fontFamily === "Verdana, sans-serif" ? "selected" : ""}>Verdana</option>
                         </select></div>`;
                html += `<div class="prop-group"><label for="font-size-input">Tamaño (px):</label><input type="number" id="font-size-input" value="${parseInt(selectedElement.style.fontSize) || 12}" min="8"></div>`;
            }
            if (type === 'arrow') {
                const rotationValue = selectedElement.dataset.rotation || 0;
                html += `<div class="prop-group"><label for="rotation-input">Rotación (°):</label><input type="number" id="rotation-input" value="${rotationValue}"></div>`;
            }
            propsContentArea.innerHTML = html;
            propsContentArea.querySelectorAll('.alignment-buttons button').forEach(btn => {
                btn.addEventListener('click', () => { selectedElement.style.textAlign = btn.dataset.align; });
            });
            const fontFamilySelect = propsContentArea.querySelector('#font-family-select');
            if (fontFamilySelect) fontFamilySelect.addEventListener('change', (e) => { selectedElement.style.fontFamily = e.target.value; });
            const fontSizeInput = propsContentArea.querySelector('#font-size-input');
            if (fontSizeInput) fontSizeInput.addEventListener('input', (e) => { selectedElement.style.fontSize = e.target.value + 'px'; });
            const rotationInput = propsContentArea.querySelector('#rotation-input');
            if (rotationInput) rotationInput.addEventListener('input', (e) => {
                const newRotation = e.target.value;
                selectedElement.style.transform = `rotate(${newRotation}deg)`;
                selectedElement.dataset.rotation = newRotation;
                updateStaticArrowConnection(selectedElement);
            });
        }

        function clearCanvas() {
            if (confirm('¿Estás seguro de que quieres limpiar todo el canvas?')) {
                canvasElement.innerHTML = ''; // Clear elements
                // Also remove connector SVGs that are direct children of canvasElement
                canvasElement.querySelectorAll(':scope > .connector-arrow-svg').forEach(svg => svg.remove());
                connections.length = 0;
                selectedElement = null; elementCounter = 0; updatePropertiesPanel();
            }
        }

        function exportWireframe() {
             const elementsToExport = [];
            document.querySelectorAll('#canvas > .wireframe-element').forEach(el => {
                const inputField = el.querySelector('.input-field');
                let textContent = el.textContent;
                const type = el.dataset.type;
                if (type === 'input' && inputField) textContent = inputField.value || inputField.placeholder;
                else if (type === 'image') textContent = el.dataset.caption || '';
                else if (type === 'arrow') textContent = '';

                elementsToExport.push({
                    id: el.id, type: type, x: parseInt(el.style.left), y: parseInt(el.style.top),
                    width: parseInt(el.style.width), height: parseInt(el.style.height), text: textContent,
                    textAlign: el.style.textAlign || '', fontFamily: el.style.fontFamily || '',
                    fontSize: el.style.fontSize || '',
                    rotation: el.dataset.rotation || 0,
                    connectsFromId: el.dataset.connectsFromId || null,
                    connectsToId: el.dataset.connectsToId || null,
                });
            });
            const connectionsToExport = connections.map(conn => ({
                fromId: conn.fromId, toId: conn.toId,
                fromAnchorType: conn.fromAnchorType, toAnchorType: conn.toAnchorType
            }));
            const exportData = { wireframeTitle: "Mi Wireframe", elements: elementsToExport, connections: connectionsToExport, timestamp: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a');
            a.href = url; a.download = 'wireframe.json'; a.click(); URL.revokeObjectURL(url);
        }

        importFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const jsonData = JSON.parse(e.target.result);
                        importWireframe(jsonData);
                    } catch (err) {
                        console.error("Error parsing JSON file:", err);
                        alert("Error al importar: el archivo no es un JSON válido.");
                    }
                };
                reader.readAsText(file);
                event.target.value = null;
            }
        });

        function importWireframe(data) {
            if (!data || !data.elements) { alert("Formato de archivo no válido."); return; }
            clearCanvas();
            elementCounter = 0;
            const elementMap = {};

            data.elements.forEach(elData => {
                createWireframeElement(elData.type, elData);
                elementMap[elData.id] = document.getElementById(elData.id);
            });

            // Recreate dynamic SVG connections
            if (data.connections && Array.isArray(data.connections)) {
                data.connections.forEach(connData => {
                    const fromEl = elementMap[connData.fromId];
                    const toEl = elementMap[connData.toId];
                    if (fromEl && toEl) {
                        const fromAnchor = connData.fromAnchorType || 'right';
                        const toAnchor = connData.toAnchorType || 'left';
                        createConnection(fromEl, fromAnchor, toEl, toAnchor);
                    }
                });
            }
            // Re-establish static arrow connections
            data.elements.forEach(elData => {
                if (elData.type === 'arrow') {
                    const arrowElement = elementMap[elData.id];
                    if (arrowElement) {
                        if (elData.connectsFromId) arrowElement.dataset.connectsFromId = elData.connectsFromId;
                        if (elData.connectsToId) arrowElement.dataset.connectsToId = elData.connectsToId;
                        // Important: Only call updateStaticArrowConnection if it's actually connected
                        if (arrowElement.dataset.connectsFromId || arrowElement.dataset.connectsToId) {
                           updateStaticArrowConnection(arrowElement);
                        }
                    }
                }
            });
            updateAllConnections(); // Refresh dynamic connector arrows
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'Delete' && selectedElement) {
                const idToRemove = selectedElement.id;
                selectedElement.remove(); selectedElement = null; updatePropertiesPanel();
                connections.slice().reverse().forEach((conn) => {
                    if (conn.fromId === idToRemove || conn.toId === idToRemove) {
                        if (conn.arrowSvgElement) conn.arrowSvgElement.remove();
                        connections.splice(connections.indexOf(conn), 1);
                    }
                });
                 document.querySelectorAll('.arrow-element').forEach(arrow => {
                    let changed = false;
                    if (arrow.dataset.connectsFromId === idToRemove) {
                        delete arrow.dataset.connectsFromId;
                        changed = true;
                    }
                    if (arrow.dataset.connectsToId === idToRemove) {
                        delete arrow.dataset.connectsToId;
                        changed = true;
                    }
                    if (changed) updateStaticArrowConnection(arrow);
                });
            }
            if (e.key === 'Escape') { deselectAll(); updatePropertiesPanel(); }
        });

        const addPageButton = document.getElementById('add-page-button');
        if (addPageButton) { addPageButton.addEventListener('click', () => { alert("La funcionalidad de múltiples páginas aún no está implementada en esta versión."); }); }

        updatePropertiesPanel();
        console.log('DOM-based Wireframing tool script loaded.');
    </script>
</body>
</html>
